name: Validate QuietSignal

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quietsignal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Bun
        run: |
          npm install --prefix "$RUNNER_TEMP/quietsignal-tools" --no-package-lock --no-audit --no-fund bun@1.3.11
          echo "$RUNNER_TEMP/quietsignal-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Test admission, disclosure and persistence
        run: bun test
      - name: Check types and formatting
        run: |
          bun run typecheck
          bun run format:check
      - name: Compile CRE workflow without account credentials
        run: |
          bunx --no-install cre-setup
          bun run build
      - name: Prepare browser checks
        run: |
          python3 -m venv "$RUNNER_TEMP/quietsignal-browser"
          echo "$RUNNER_TEMP/quietsignal-browser/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/quietsignal-browser/bin/pip" install playwright==1.62.0
          "$RUNNER_TEMP/quietsignal-browser/bin/python" -m playwright install --with-deps chromium
      - name: Check website and isolated pilot
        run: |
          bun run build:web
          bun run check:web
          bun run check:pilot
      - name: Prepare the validated portfolio website
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir -p "$RUNNER_TEMP/quietsignal-pages"
          cp dist/index.html "$RUNNER_TEMP/quietsignal-pages/index.html"
          touch "$RUNNER_TEMP/quietsignal-pages/.nojekyll"
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/quietsignal-pages

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the validated website
        id: deployment
        uses: actions/deploy-pages@v4
